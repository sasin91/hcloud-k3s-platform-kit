# OpenTelemetry Collector — the thing that makes traces useful.
#
# WHY THIS EXISTS. Before it, this kit installed a trace store, probed it for
# readiness, scraped its metrics, and sent it nothing. A component kept alive,
# confirmed healthy, and doing no work — the same shape as an alert rule that is
# loaded but never fires, or a backup that reports success having captured
# nothing. Both of those are lessons in LESSONS.md. This was shipped anyway.
#
# WHY NOT EXPORT STRAIGHT TO THE STORE. Applications can, and it works. What it
# does not give you is context: a span arrives knowing nothing about the pod,
# namespace or node that produced it, so joining a trace to the logs from the
# same workload is manual guesswork. The k8sattributes processor below stamps
# that context onto every span, and the log pipeline enriches log lines the same
# way — which is what makes a trace and a log line meet.
#
# It also absorbs three problems applications should not own: batching, retry
# when the store is unreachable, and sampling policy. Tail-based sampling — the
# only kind that can keep a trace *because* it errored — is impossible anywhere
# else, because nothing else sees the whole trace.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: opentelemetry
  namespace: flux-system
spec:
  interval: 24h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: flux-system
spec:
  # REQUIRED. The lockdown flag --default-service-account=default means a
  # HelmRelease naming no account reconciles as the namespace's default service
  # account, which has no permissions — helm-controller then cannot even read the
  # secrets Helm stores release state in, and the release fails with a message
  # about querying storage rather than about permissions. Verified on a live
  # cluster: without this, the platform layer cannot install itself.
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 10m
  targetNamespace: observability
  # PIN THE RELEASE NAME. Flux otherwise derives it as <targetNamespace>-<name>,
  # and that derived name is an input to every name the chart generates. On a
  # live cluster it broke three things at once: two Services were renamed so the
  # endpoints pointing at them silently stopped resolving, and one chart's
  # generated label crossed the 63-byte limit, leaving the release wedged in
  # 'uninstalling' -- unable to remediate, because the hook it must run to
  # uninstall was the invalid object.
  releaseName: opentelemetry-collector
  chart:
    spec:
      chart: opentelemetry-collector
      # Pinned. An unpinned chart reference is a latent breaking change, and CI
      # fails on one.
      version: "0.166.0"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # PIN THE GENERATED NAME. Without this the chart derives service names from
    # the Helm release name, which Flux forms as <targetNamespace>-<name> -- so
    # moving a HelmRelease between namespaces silently renames its Service and
    # breaks every endpoint that referenced it. Nothing errors: the exporter
    # keeps sending to a name that no longer resolves and the data is simply
    # gone. Verified on a live cluster, twice in one pipeline.
    fullnameOverride: opentelemetry-collector
    # A Deployment, not a DaemonSet. A DaemonSet would let workloads export to
    # their own node and skip a hop, but it also means the tenant NetworkPolicy
    # has to permit egress to every node address rather than to one Service —
    # which is a materially wider hole for a latency saving nobody has measured.
    mode: deployment
    replicaCount: 1

    image:
      repository: otel/opentelemetry-collector-contrib

    # k8sattributes needs to read pods and namespaces cluster-wide to resolve
    # which workload a span came from. This is the one privilege the collector
    # genuinely needs, and it is read-only.
    presets:
      kubernetesAttributes:
        enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 512Mi

    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        # Order matters and is not arbitrary. k8sattributes must run before
        # batching, because it resolves identity from the connection's source
        # address — and once spans are batched, that association is gone.
        k8sattributes:
          auth_type: serviceAccount
          passthrough: false
          extract:
            metadata:
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.node.name
              - k8s.deployment.name
              - k8s.pod.uid

        # A limit, not a target. Without it the collector answers a traffic spike
        # by growing until the kubelet kills it, and a restarting collector loses
        # every span in flight — so the symptom of too much load is missing data
        # rather than slow data.
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15

        batch:
          timeout: 5s
          send_batch_size: 512

      exporters:
        # Traces.
        otlp/tempo:
          endpoint: tempo.observability.svc.cluster.local:4317
          tls:
            insecure: true

        # Metrics. The metric store speaks Prometheus remote-write, so the
        # application emits OTLP and never learns that. The indirection is the
        # point: the store is replaceable without touching a workload.
        #
        # These hostnames are stable only because every release pins
        # releaseName. Without it the chart derives service names from a value
        # that changes when the release moves, and this endpoint silently stops
        # resolving -- see LESSONS.md.
        prometheusremotewrite:
          endpoint: http://vmsingle-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428/api/v1/write
          # Carry the k8s.* resource attributes onto the series as labels.
          # Without this a metric arrives not knowing which pod produced it and
          # cannot be lined up with the trace from the same request.
          resource_to_telemetry_conversion:
            enabled: true

        # Logs. Same shape: OTLP in, the store's native protocol out.
        otlphttp/victorialogs:
          logs_endpoint: http://victoria-logs-single-server.observability.svc.cluster.local:9428/insert/opentelemetry/v1/logs

      service:
        pipelines:
          traces:
            receivers: [otlp]
            # memory_limiter first: it can only shed load if it sees a span
            # before any work has been done on it.
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlp/tempo]

          # One receiver, three destinations. An application configures a single
          # endpoint and gets all three signals routed and enriched identically
          # -- which is what makes a trace, the metrics it moved, and the log
          # lines it wrote joinable by pod and namespace instead of by guesswork.
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [prometheusremotewrite]

          logs:
            receivers: [otlp]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/victorialogs]

        telemetry:
          metrics:
            # The collector's own metrics, so "are we dropping spans" is
            # answerable. A pipeline you cannot observe is one you will trust
            # until the day it is empty.
            level: normal

    # NOT EXPOSED. Nothing outside the cluster should be able to write spans:
    # an open OTLP receiver is an unauthenticated append-only log that anyone
    # can fill, and the first symptom is a storage bill.
    service:
      type: ClusterIP

    ports:
      otlp:
        enabled: true
      otlp-http:
        enabled: true
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

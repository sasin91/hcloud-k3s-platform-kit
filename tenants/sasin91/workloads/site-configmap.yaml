# The rendered site, as data.
#
# WHY A ConfigMap AND NOT AN IMAGE. This kit ships no registry on purpose (see
# the README), so there is nowhere to push a custom image to. A static site is
# the one workload shape that does not need one: the artifact is bytes, and
# bytes fit in the API.
#
# ConfigMap keys may not contain "/", so each key is the path with separators
# replaced. The Deployment's volume projects each key back to its real path via
# items[].path, which MAY contain slashes. That is what makes /blog/index.html
# reachable without a custom image.
#
# GENERATED, NOT HAND-WRITTEN. Produced from `cargo run` over
# github.com/sasin91/sasin91 (an Askama/jotdown static generator) and committed.
# The binary assets over 40 KB are omitted -- a 2.3 MB video does not belong in
# etcd, and the object limit is 1 MB.
apiVersion: v1
kind: ConfigMap
metadata:
  name: site
data:

      <h1>About</h1>
      <p class="lede">Software developer. Available for work.</p>
    
      
      
        <p>I enjoy both big and small tasks. I have taken full projects from start to finish and maintained them afterwards.</p>
      
        <p>In general I push for the simplest solution and aim for long-term stability. That is roughly why this site is a small Rust binary and a folder of text files, and why AthletOS runs on one FreeBSD box I can roll back when I break something.</p>
      
        <p>Based in Slagelse. PHP and Laravel since 2015 — a ticketing agency, a video streaming platform, a recruitment platform — with Symfony, Go, Kubernetes and Rust picked up along the way, where the problem asked for them.</p>
      
        <p>I write here when something seems worth writing down. Usually after it broke, and usually with the numbers.</p>
      
    
      <p><a href="/cv/">Read the full CV</a>, or take the <a href="/cv.pdf">PDF</a>.</p>
    

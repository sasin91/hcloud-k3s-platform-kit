            <p class="meta">
              <time datetime="2014-02">February 2014</time>
              
                – <time datetime="2015-08">August 2015</time>
              
              — Høng
            </p>
            
          </article>
        
          <article class="cv-role">
            <h3>Strøm, styring &#38; IT · Selandia CEU</h3>
            <p class="meta">
              <time datetime="2012-01">January 2012</time>
              
                – <time datetime="2013-08">August 2013</time>
              
              — Slagelse

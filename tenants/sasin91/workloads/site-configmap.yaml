    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> ARC takes half of RAM by default. On a 4GB box that is 2GB it does not</span><span class="hl-comment hl-line hl-number-sign hl-shell">

        </g>
        <g stroke="var(--diagram-rule, #1f2937)" stroke-width="1">
          <line x1="368" y1="96" x2="368" y2="248"/>
          <line x1="556" y1="96" x2="556" y2="248"/>
          <line x1="744" y1="96" x2="744" y2="248"/>
          <line x1="932" y1="96" x2="932" y2="248"/>
        </g>
    
        <!-- green row -->
        <text x="160" y="132" text-anchor="end" font-size="14" fill="light-dark(#4d7c0f, #84cc16)" font-weight="700">green</text>
        <rect x="180" y="112" width="376" height="30" rx="6" fill="var(--diagram-panel, #1f2937)"/>
        <text x="368" y="132" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #9ca3af)">stop · repoint · start · health</text>
        <rect x="556" y="112" width="564" height="30" rx="6" fill="url(#d-green)" fill-opacity="0.85"/>
        <!-- This text sits on the bar above, not the panel: the bar itself
             darkens in light mode (see d-green's stops), so the text that reads
             against it has to flip light too, or the two would collide. -->
        <text x="838" y="132" text-anchor="middle" font-size="12" fill="light-dark(#ffffff, #052e16)" font-weight="700">serving v0.1.2</text>
    
        <!-- blue row -->
        <text x="160" y="192" text-anchor="end" font-size="14" fill="light-dark(#0e7490, #22d3ee)" font-weight="700">blue</text>
        <rect x="180" y="172" width="376" height="30" rx="6" fill="url(#d-blue)" fill-opacity="0.85"/>
        <text x="368" y="192" text-anchor="middle" font-size="12" fill="light-dark(#ffffff, #082f49)" font-weight="700">serving previous release</text>
        <rect x="556" y="172" width="376" height="30" rx="6" fill="var(--diagram-panel, #1f2937)"/>
        <text x="744" y="192" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #9ca3af)">stop · repoint · start · health</text>
        <rect x="932" y="172" width="188" height="30" rx="6" fill="url(#d-blue)" fill-opacity="0.85"/>
        <text x="1026" y="192" text-anchor="middle" font-size="12" fill="light-dark(#ffffff, #082f49)" font-weight="700">v0.1.2</text>
    
        <!-- healthy-backends band -->
        <text x="160" y="228" text-anchor="end" font-size="12" fill="var(--diagram-muted, #6b7280)">healthy</text>
        <rect x="180" y="216" width="940" height="16" rx="4" fill="#052e16" stroke="#166534"/>
        <text x="650" y="228" text-anchor="middle" font-size="11" fill="#4ade80">at least one, the entire time</text>
    
        <text x="48" y="306" font-size="13" fill="var(--diagram-muted, #6b7280)">The health gate allows 120s and used 2. Caddy checks every 5s, so it never observed a gap at all.</text>
      </g>
    </svg>
    </figure></p>
    <p>Five seconds, and never a moment without a healthy backend. The same machinery
    covers a crash at 3am: Caddy marks the jail down and the other one serves until
    I look.</p>
    <div class="note">
    <h2 id="Migrations">Migrations</h2>
    <p>Two releases are briefly live against one database, so a migration has to be
    backward compatible with the one before it.</p>
    </div>
    </section>
    <section id="Certificates">
    <h2>Certificates</h2>
    <p>Certificate lifetimes are dropping to <strong>47 days</strong>, which turns renewal into eight
    chances a year for a hook to fail quietly. Caddy just does it. No certbot, no
    timer, nothing to forget.</p>
    <div class="codeblock"><div class="filename">Caddyfile</div><pre class="hl-code"><code><span class="hl-text hl-plain">{$APP_DOMAIN} {
    	encode zstd gzip
    	reverse_proxy 10.0.0.2:3000 10.0.0.3:3000 {
    		lb_policy       least_conn
    		health_uri      /login
    		health_interval 5s
    	}
    }
    </span></code></pre></div>
    </section>
    <section id="Efficiency">
    <h2>Efficiency</h2>
    <p>
    <figure class="diagram" role="img" aria-label="Memory footprint: 2.19 GB free of 3.86 GB with everything running"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Memory use on a 3.86 GB box with everything running: about 1.67 GB in use across ARC, Postgres, two SvelteKit processes, Caddy and two API processes, leaving 2.19 GB free.">
      <defs>
        <!-- Standalone only, see architecture.svg for why svg:root, not
             :root, and why it must stay scoped this way. -->
        <style>svg:root { color-scheme: dark; }</style>
        <linearGradient id="f-panel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--diagram-bg, #12121b)"/><stop offset="100%" stop-color="var(--diagram-panel, #0a0a10)"/>
        </linearGradient>
      </defs>
    
      <rect width="1200" height="400" rx="24" fill="url(#f-panel)"/>
      <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.08"/>
    
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="48" y="48" font-size="16" fill="var(--diagram-text, #e5e7eb)">memory, everything serving</text>
        <text x="1152" y="48" text-anchor="end" font-size="16" fill="light-dark(#15803d, #4ade80)" font-weight="700">2.19 GB free of 3.86</text>
    
        <!-- bars: 1 MB = 0.26 px, max width 1000 -->
        <g font-size="13">
          <text x="200" y="104" text-anchor="end" fill="light-dark(#92400e, #fbbf24)">ZFS ARC</text>
          <rect x="216" y="90" width="360" height="22" rx="5" fill="light-dark(#b45309, #f59e0b)"/>
          <text x="592" y="106" font-size="12" fill="var(--diagram-muted, #6b7280)">526 MB · capped at 512, holds there</text>
    
          <text x="200" y="144" text-anchor="end" fill="light-dark(#075985, #38bdf8)">PostgreSQL</text>
          <rect x="216" y="130" width="327" height="22" rx="5" fill="light-dark(#0369a1, #0ea5e9)"/>
          <text x="559" y="146" font-size="12" fill="var(--diagram-muted, #6b7280)">477 MB · shared buffers counted per backend</text>
    
          <text x="200" y="184" text-anchor="end" fill="light-dark(#6d28d9, #a78bfa)">SvelteKit ×2</text>
          <rect x="216" y="170" width="163" height="22" rx="5" fill="#8b5cf6"/>
          <text x="395" y="186" font-size="12" fill="var(--diagram-muted, #6b7280)">238 MB · 119 each, one per jail</text>
    
          <text x="200" y="224" text-anchor="end" fill="light-dark(#be185d, #f472b6)">Caddy</text>
          <rect x="216" y="210" width="42" height="22" rx="5" fill="light-dark(#be185d, #ec4899)"/>
          <text x="274" y="226" font-size="12" fill="var(--diagram-muted, #6b7280)">61 MB</text>
    
          <text x="200" y="264" text-anchor="end" fill="light-dark(#15803d, #4ade80)">AthletOS API ×2</text>
          <rect x="216" y="250" width="35" height="22" rx="5" fill="light-dark(#15803d, #22c55e)"/>
          <text x="267" y="266" font-size="12" fill="var(--diagram-muted, #6b7280)">51 MB · the whole application</text>
        </g>
    
        <line x1="216" y1="296" x2="1120" y2="296" stroke="var(--diagram-rule, #1f2937)"/>
    
        <text x="200" y="330" text-anchor="end" font-size="13" fill="var(--diagram-muted, #9ca3af)">free</text>
        <rect x="216" y="316" width="569" height="22" rx="5" fill="var(--diagram-panel, #1f2937)" stroke="var(--diagram-rule, #374151)"/>
        <text x="801" y="332" font-size="12" fill="var(--diagram-muted, #6b7280)">2189 MB</text>
    
        <text x="48" y="374" font-size="13" fill="var(--diagram-muted, #9ca3af)">The Rust API is the smallest thing on the box. It grew 0.3 MB across 200 requests that each build a full session.</text>
      </g>
    </svg>
    </figure></p>
    <p>The efficiency speaks for itself. Plenty of room — likely more than I will ever
    need for this app.</p>
    <p>The API answers in under a millisecond. Everything else in the numbers below is
    the distance to Helsinki and a fresh handshake per sample.</p>
    <div class="codeblock"><div class="filename">latency, from my desk in Denmark</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">api,</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> loopback inside the box      p50  0.0 ms   p95  0.6 ms</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">https://api.athletos.app/health</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">   p50  136 ms   p95  143 ms</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">https://athletos.app/login</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">        p50  136 ms   p95  247 ms</span>
    </span></code></pre></div>
    </section>
    <section id="Backups">
    <h2>Backups</h2>
    <p>The backup story is refreshingly stable and efficient, with
    <a href="https://github.com/jimsalterjrs/sanoid">sanoid</a> taking snapshots on a timer and
    syncoid piggybacking on ZFS to move them offsite. Jails ensure a reproducible
    and reliable runtime environment. There is little left for me to desire at this
    scale.</p>
    <div class="codeblock"><div class="filename">zfs list -t snapshot</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">zroot/data/pgdata@autosnap_2026-07-26_17:24:00_hourly</span></span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">zroot/data/pgdata@autosnap_2026-07-26_17:24:00_daily</span></span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">zroot/data/pgdata@autosnap_2026-07-26_17:24:00_monthly</span></span>
    </span></code></pre></div>
    </section>
    <section id="Was-it-worth-it">
    <h2>Was it worth it</h2>
    <p>Absolutely. Stable, reliable and predictable. I can trust this to keep running.</p>
    <div class="warning">
    <h2 id="What-broke-on-first-contact">What broke on first contact</h2>
    <p>Five things broke on a real box. Four were ordinary. The fifth was worth
    remembering: <code>${name}_user</code> is a reserved <code>rc.subr</code> variable, and <code>rc.subr</code>
    wraps your command in <code>su -m</code> before it runs. My rc script named a variable
    <code>athletos_api_user</code> thinking it was mine, so <code>daemon(8)</code> was already running as
    that user when it tried to drop privileges to that user. Two privilege drops
    fighting, and <code>-r</code> retried it forever. The error it prints is “failed to set
    user environment”, which sounds like <code>login.conf</code> and is not.</p>
    </div>
    <div class="note">
    <h2 id="Building-on-the-target">Building on the target</h2>
    <p>CI builds inside a FreeBSD VM and runs the test suite there before producing a
    binary. Rust is a Tier 2 platform on FreeBSD — the project builds it but does
    not test it — so building and testing on the release you actually deploy to is
    doing work nobody upstream does for you.</p>
    </div>
    <div class="warning">
    <h2 id="ARC-eats-your-RAM">ARC eats your RAM</h2>
    <p>ARC takes half your RAM unless told otherwise. On a 4 GB box that is 2 GB it
    does not need, and it shows up later looking like a database problem. Put
    <code>vfs.zfs.arc_max="512M"</code> in <code>loader.conf</code>, on day one.</p>
    </div>
    <p class="colophon">Every number above was measured on the box, not estimated.</p>
    </section>
    
      </article>
    
      
      

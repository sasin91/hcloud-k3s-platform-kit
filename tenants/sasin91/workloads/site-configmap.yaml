    <div class="codeblock"><div class="filename">isowork/etc/installerconfig</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-variable hl-other hl-readwrite hl-assignment hl-shell">PARTITIONS</span><span class="hl-keyword hl-operator hl-assignment hl-shell">=</span><span class="hl-string hl-unquoted hl-shell">DEFAULT</span>

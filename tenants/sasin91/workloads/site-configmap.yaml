    </span><span class="hl-meta hl-function-call hl-shell"><span class="hl-support hl-function hl-echo hl-shell">echo</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-string hl-quoted hl-single hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span>vfs.zfs.arc_max=&quot;512M&quot;<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span> <span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&gt;&gt;</span> /boot/loader.conf</span>
    

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Memory use on a 3.86 GB box with everything running: about 1.67 GB in use across ARC, Postgres, two SvelteKit processes, Caddy and two API processes, leaving 2.19 GB free.">

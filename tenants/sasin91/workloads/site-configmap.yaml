      <h1>Writing</h1>
      <p class="lede">Notes on things I built and what broke on the way.</p>
    
      <ul class="post-list">
        
          <li>
            <div class="meta">
              <time datetime="2026-07-26">July 26, 2026</time>
            </div>
            <h2><a href="/blog/athletos-freebsd/">One box, two jails and a five second deploy</a></h2>
            <p>AthletOS runs on a single €7 FreeBSD box. Two jails that are always up, Caddy handling certificates on its own, and a rolling deploy that never leaves zero healthy backends. What the boring choices bought, measured rather than estimated.</p>
          </li>
        
          <li>
            <div class="meta">
              <time datetime="2026-07-26">July 26, 2026</time>
            </div>
            <h2><a href="/blog/freebsd-on-hetzner/">FreeBSD on a Hetzner Cloud VPS</a></h2>
            <p>Hetzner has no FreeBSD image, and the installer everyone recommends never verifies what it downloads before handing it root. In this article I install 15.1 on root-on-ZFS the honest way, and walk through the five things that broke on the way there.</p>
          </li>
        
          <li>
            <div class="meta">
              <time datetime="2025-03-03">March 3, 2025</time>

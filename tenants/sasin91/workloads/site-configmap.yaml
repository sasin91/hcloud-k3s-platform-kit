    <span class="hl-meta hl-function-call hl-shell"><span class="hl-support hl-function hl-echo hl-shell">echo</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-string hl-quoted hl-single hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span>ssh-ed25519 AAAA... you@host<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span> <span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&gt;</span> /root/.ssh/authorized_keys</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">chmod</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> 600 /root/.ssh/authorized_keys</span>
    </span></code></pre></div>
    <p><code>10.0.2.2</code> is QEMU’s host address. Serving the distribution sets from rescue skips DNS entirely and is quicker than fetching them twice.</p>

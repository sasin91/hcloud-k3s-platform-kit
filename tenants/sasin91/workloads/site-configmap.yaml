    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="A terminal window showing FreeBSD 15.1 installing to a ZFS root, with the disk partition layout beneath">
      <defs>
        <!-- Standalone only, see architecture.svg for why svg:root, not
             :root, and why it must stay scoped this way. -->
        <style>svg:root { color-scheme: dark; }</style>
        <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--diagram-bg, #12121b)"/>
          <stop offset="100%" stop-color="var(--diagram-panel, #0a0a10)"/>
        </linearGradient>
    
        <!-- See architecture.svg for why some data stops carry a light-dark()
             pair and others (already >= 3:1 against the light panel) don't. -->
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">

          <path d="M40 0H0V40" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.03" stroke-width="1"/>
        </pattern>
      </defs>
    
      <rect width="1200" height="440" rx="24" fill="url(#panel)"/>
      <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
      <rect x="0.5" y="0.5" width="1199" height="439" rx="24" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.08"/>
    
      <!-- window chrome -->
      <circle cx="42" cy="40" r="7" fill="light-dark(#dc2626, #ff5f57)"/>
      <circle cx="66" cy="40" r="7" fill="light-dark(#a16207, #febc2e)"/>

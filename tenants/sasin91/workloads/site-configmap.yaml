        <h1>One box, two jails and a five second deploy</h1>
        <div class="meta">
          <time datetime="2026-07-26">July 26, 2026</time>
        </div>
    
        
    <p>The essence is simple and efficient. That is exactly why I chose
    <a href="/blog/freebsd-on-hetzner/">FreeBSD</a> as the foundation and
    <a href="https://github.com/sasin91/athletos.app/tree/main/backend">Rust</a> as the base.</p>
    <blockquote>
    <p>AthletOS picks a program, prescribes the weights, and records what you
    actually lifted next to what it asked for.</p>
    <p>The gap between those two numbers is the entire product. I do not need a
    motivational chart, I need to be told 100 kg and not talk myself into 120.</p>
    </blockquote>
    <p>One Hetzner CX23, about €7 a month. FreeBSD 15.1, root-on-ZFS, two jails, Caddy,
    Postgres.</p>
    <section id="Why-not-Docker">
    <h2>Why not Docker</h2>
    <p>While Docker is great, well supported and convenient, it is also additional
    complexity and overhead that I do not need. With
    <a href="/blog/freebsd-on-hetzner/">FreeBSD</a> I have everything I need to ensure smooth
    rollouts and consistent performance with <em>minimal</em> overhead and tooling.</p>
    </section>
    <section id="Rollouts">
    <h2>Rollouts</h2>
    <p>Two jails, blue and green, both running all the time and both registered with
    Caddy. A deploy takes one out, swaps a symlink, waits for it to answer, and only
    then touches the other.</p>
    <p>
    <figure class="diagram" role="img" aria-label="Rolling deploy timeline: five seconds, always at least one healthy backend"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Timeline of a rolling deploy: green is stopped and restarted in the first two seconds while blue keeps serving, then blue is rolled while green serves. Five seconds total, never zero healthy backends.">
      <defs>
        <!-- Standalone only, see architecture.svg for why svg:root, not
             :root, and why it must stay scoped this way. -->
        <style>svg:root { color-scheme: dark; }</style>
        <linearGradient id="d-panel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--diagram-bg, #12121b)"/>
          <stop offset="100%" stop-color="var(--diagram-panel, #0a0a10)"/>
        </linearGradient>
        <!-- See architecture.svg for why some data stops carry a light-dark()
             pair and others (already >= 3:1 against the light panel) don't. -->
        <linearGradient id="d-blue" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="light-dark(#0e7490, #22d3ee)"/>
        </linearGradient>
        <linearGradient id="d-green" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="light-dark(#047857, #10b981)"/><stop offset="100%" stop-color="light-dark(#4d7c0f, #84cc16)"/>
        </linearGradient>
      </defs>
    
      <rect width="1200" height="330" rx="24" fill="url(#d-panel)"/>
      <rect x="0.5" y="0.5" width="1199" height="329" rx="24" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.08"/>
    
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="48" y="48" font-size="16" fill="var(--diagram-text, #e5e7eb)">athletos-deploy v0.1.2 — rolling update</text>
        <text x="1152" y="48" text-anchor="end" font-size="16" fill="light-dark(#15803d, #4ade80)" font-weight="700">5s total</text>
    
        <!-- axis -->
        <line x1="180" y1="248" x2="1120" y2="248" stroke="var(--diagram-rule, #374151)" stroke-width="1"/>
        <g font-size="12" fill="var(--diagram-muted, #4b5563)">

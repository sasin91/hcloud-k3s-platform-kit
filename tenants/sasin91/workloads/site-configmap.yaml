        <h1>FreeBSD on a Hetzner Cloud VPS</h1>
        <div class="meta">
          <time datetime="2026-07-26">July 26, 2026</time>
        </div>
    
        
    <p>Hetzner has no FreeBSD image and their ISO library stops at 15.0. You can still get <strong>any</strong> release on there, unattended, in about an hour.</p>
    <blockquote>
    <p>The box runs AthletOS, a training app I am building. Predefined programs, session logging and tracking.</p>
    <p>— I picked FreeBSD for ZFS boot environments and jails, so a bad deploy is a rollback instead of an incident.</p>
    </blockquote>
    <p>This is the whole procedure, in order, with the things that went wrong and what fixed them. I used FreeBSD’s own ISO rather than a prebuilt image, so the checksum can be verified against the project’s manifest.</p>
    <section id="1-Create-the-server">
    <h2>1. Create the server</h2>
    <p>A CX23 gives 2 vCPU and 4 GB, which is plenty. Firewall first, then the box.</p>
    <div class="codeblock"><div class="filename">1-create-server.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">hcloud</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> firewall create<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>name</span> athletos</span>
    <span class="hl-keyword hl-control hl-for hl-shell">for</span><span class="hl-meta hl-group hl-for hl-shell"> p <span class="hl-keyword hl-control hl-in hl-shell">in</span> 22 80 443</span><span class="hl-keyword hl-operator hl-logical hl-continue hl-shell">;</span> <span class="hl-keyword hl-control hl-do hl-shell">do</span>
      <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">hcloud</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> firewall add-rule athletos<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>direction</span> in<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>protocol</span> tcp <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">    --</span>port</span> <span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">p</span></span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>source-ips</span> 0.0.0.0/0<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>source-ips</span> ::/0</span>
    <span class="hl-keyword hl-control hl-done hl-shell">done</span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">hcloud</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> server create<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>name</span> athletos<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>type</span> cx23<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>location</span> hel1 <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">  --</span>image</span> debian-12<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>ssh-key</span> my-key<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>firewall</span> athletos</span>
    </span></code></pre></div>
    <p>The image is a throwaway. It only exists so the server boots at all.</p>
    </section>
    <section id="2-Boot-into-rescue">
    <h2>2. Boot into rescue</h2>
    <div class="codeblock"><div class="filename">2-rescue.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">hcloud</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> server enable-rescue athletos<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>ssh-key</span> my-key</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">hcloud</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> server reset athletos</span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">ssh</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> root@<span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&lt;</span>ip<span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&gt;</span>          # linux rescue, <span class="hl-meta hl-group hl-expansion hl-tilde"><span class="hl-variable hl-language hl-tilde hl-shell">~</span></span>1.9GB overlay in RAM</span>
    </span></code></pre></div>
    </section>
    <section id="3-Fetch-and-verify-the-ISO">
    <h2>3. Fetch and verify the ISO</h2>
    <p>Take <code>bootonly</code>, not <code>disc1</code>. The rescue root is a small RAM overlay and a 1.3 GB ISO plus its extraction plus the rebuild will not fit.</p>
    <div class="codeblock"><div class="filename">3-fetch-iso.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-variable hl-other hl-readwrite hl-assignment hl-shell">B</span><span class="hl-keyword hl-operator hl-assignment hl-shell">=</span><span class="hl-string hl-unquoted hl-shell">https://download.freebsd.org/releases/amd64/amd64/ISO-IMAGES/15.1</span>
    <span class="hl-variable hl-other hl-readwrite hl-assignment hl-shell">I</span><span class="hl-keyword hl-operator hl-assignment hl-shell">=</span><span class="hl-string hl-unquoted hl-shell">FreeBSD-15.1-RELEASE-amd64-bootonly.iso</span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">curl</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>fsSL</span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>o</span> CHECKSUM <span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">B</span></span>/CHECKSUM.SHA256-FreeBSD-15.1-RELEASE-amd64</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">curl</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>fsSL</span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>o</span> <span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">I</span></span> <span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">B</span></span>/<span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">I</span></span></span>
    
    <span class="hl-variable hl-other hl-readwrite hl-assignment hl-shell">E</span><span class="hl-keyword hl-operator hl-assignment hl-shell">=</span><span class="hl-string hl-unquoted hl-shell"><span class="hl-meta hl-group hl-expansion hl-command hl-parens hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-punctuation hl-section hl-parens hl-begin hl-shell">(</span><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">grep</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>E</span> <span class="hl-string hl-quoted hl-double hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&quot;</span>\(<span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">I</span></span>\)<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&quot;</span></span> CHECKSUM</span> <span class="hl-keyword hl-operator hl-logical hl-pipe hl-shell">|</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">sed</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-string hl-quoted hl-single hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span>s/.*= //<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span></span><span class="hl-punctuation hl-section hl-parens hl-end hl-shell">)</span></span></span>
    <span class="hl-variable hl-other hl-readwrite hl-assignment hl-shell">A</span><span class="hl-keyword hl-operator hl-assignment hl-shell">=</span><span class="hl-string hl-unquoted hl-shell"><span class="hl-meta hl-group hl-expansion hl-command hl-parens hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-punctuation hl-section hl-parens hl-begin hl-shell">(</span><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">sha256sum</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">I</span></span></span> <span class="hl-keyword hl-operator hl-logical hl-pipe hl-shell">|</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">cut</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>d</span><span class="hl-string hl-quoted hl-single hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span> <span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>f1</span></span><span class="hl-punctuation hl-section hl-parens hl-end hl-shell">)</span></span></span>
    <span class="hl-support hl-function hl-test hl-begin hl-shell">[</span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-string hl-quoted hl-double hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&quot;</span><span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">E</span></span><span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&quot;</span></span> <span class="hl-keyword hl-operator hl-logical hl-shell">=</span> <span class="hl-string hl-quoted hl-double hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&quot;</span><span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">A</span></span><span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&quot;</span></span> <span class="hl-support hl-function hl-test hl-end hl-shell">]</span></span> <span class="hl-keyword hl-operator hl-logical hl-and hl-shell">&amp;&amp;</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-support hl-function hl-echo hl-shell">echo</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-string hl-quoted hl-double hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&quot;</span>verified<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&quot;</span></span></span> <span class="hl-keyword hl-operator hl-logical hl-or hl-shell">||</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-support hl-function hl-echo hl-shell">echo</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-string hl-quoted hl-double hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&quot;</span>STOP<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&quot;</span></span></span>
    </span></code></pre></div>
    </section>
    <section id="4-Remaster-the-ISO">
    <h2>4. Remaster the ISO</h2>
    <p>Three edits: a serial console so we can watch it, the prompt that would otherwise block forever, and the network the scripted install never configures for itself.</p>
    <div class="codeblock"><div class="filename">4-remaster.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">apt-get</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> install<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>y</span> xorriso qemu-system-x86</span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">mkdir</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>p</span> isowork isomnt</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">mount</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>o</span> loop,ro <span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">I</span></span> isomnt</span> <span class="hl-keyword hl-operator hl-logical hl-and hl-shell">&amp;&amp;</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">cp</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>a</span> isomnt/. isowork/</span> <span class="hl-keyword hl-operator hl-logical hl-and hl-shell">&amp;&amp;</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">umount</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> isomnt</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">chmod</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>R</span> u+w isowork</span>
    
    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> append, never replace: the original carries vfs.root.mountfrom</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">cat</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&gt;&gt;</span> isowork/boot/loader.conf <span class="hl-string hl-unquoted hl-heredoc hl-shell"><span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&lt;&lt;</span><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span><span class="hl-keyword hl-control hl-heredoc-token hl-shell">EOF</span><span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span><span class="hl-string hl-unquoted hl-heredoc hl-shell">
    console=&quot;comconsole&quot;
    comconsole_speed=&quot;115200&quot;
    boot_serial=&quot;YES&quot;
    vfs.root.mountfrom=&quot;cd9660:/dev/iso9660/FREEBSD_INSTALL&quot;
    <span class="hl-keyword hl-control hl-heredoc-token hl-shell">EOF</span></span></span>
    
    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> the serial path asks for a terminal type with an unconditional read</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">sed</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>i</span> <span class="hl-string hl-quoted hl-single hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span>s/^\([[:space:]]*\)read TERM$/\1:/<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span> <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span>    isowork/usr/libexec/bsdinstall/startbsdinstall</span>
    
    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> a scripted install never configures the network</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">sed</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>i</span> <span class="hl-string hl-quoted hl-single hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span>s|^mkdir /tmp/bsdinstall_etc$|&amp;\nifconfig vtnet0 inet 10.0.2.15/24 up\nroute add default 10.0.2.2\necho &quot;nameserver 10.0.2.3&quot; &gt; /tmp/bsdinstall_etc/resolv.conf|<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span> <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span>    isowork/etc/rc.local</span>
    </span></code></pre></div>
    <div class="warning">
    <h2 id="What-went-wrong">What went wrong</h2>
    <p>I replaced <code>loader.conf</code> instead of appending, which threw away <code>vfs.root.mountfrom</code> and left it at a mountroot prompt.</p>
    <p>Then it hung at <code>Console type [vt100]:</code> because that <code>read</code> runs before the script is ever looked for.</p>
    <p>Then distfetch died on DNS, because the interactive path exports <code>BSDINSTALL_CONFIGCURRENT</code> and the scripted path does not.</p>
    </div>
    </section>
    <section id="5-Write-the-unattended-install-script">

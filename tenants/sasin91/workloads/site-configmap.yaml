    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">sysrc</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> sshd_enable=<span class="hl-string hl-quoted hl-double hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&quot;</span>YES<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&quot;</span></span></span>

      <article class="cv">
        <p class="cv-download"><a href="/cv.pdf">Download as PDF</a></p>
    
        <header class="cv-header">
          <h1>Jonas Hansen</h1>
          <p class="lede">Software developer</p>
          
          <p class="cv-contact sep-list">
            <span>Slagelse, 4200</span>
            <span><a href="tel:+4550106917">+45 50106917</a></span>
            <span><a href="mailto:jonas.kerwin.hansen@gmail.com">jonas.kerwin.hansen@gmail.com</a></span>
            <span><a href="https://github.com/sasin91">GitHub</a></span>
            <span><a href="https://www.linkedin.com/in/jonas-hansen-2b6828110">LinkedIn</a></span>
          </p>
        </header>
    
        
          <p>I have been working with PHP and Laravel since 2015 and since then I have helped develop a ticketing agency, a video streaming platform and a recruitment platform.</p>
        
          <p>I enjoy designing and delivering customized and solid solutions, but also enjoy support and listening to user requests and issues with a smile.</p>
        
    
        <h2>Experience</h2>
        
          <article class="cv-role">
            <h3>Web developer · JUICE ApS</h3>
            <p class="meta">
              <time datetime="2024-09">September 2024</time>
              
                – <time datetime="2026-02">February 2026</time>
              
              — Copenhagen
            </p>
            <p>Job &#38; candidate matchmaking platform</p>
            
              <ul>
                
                  <li>Upgraded Symfony 6 to 7</li>
                
                  <li>Built a comprehensive ranking and sorting engine, delivering a quick and efficient method of finding candidates and sorting by relevancy</li>
                
                  <li>AI integration, making it a breeze to upload a job ad and receiving a SmartMatch job post</li>
                
              </ul>
            
          </article>
        
          <article class="cv-role">
            <h3>Web developer · Supeo</h3>
            <p class="meta">
              <time datetime="2023-09">September 2023</time>
              
                – <time datetime="2024-09">September 2024</time>
              
              — Næstved
            </p>
            <p>Web development agency</p>
            
              <ul>
                
                  <li>Delivered multiple features on Supeo Flex, in React, Express.js &#38; GraphQL</li>
                
                  <li>Gained sole responsibility of customer interactions and development of SamFocus in Laravel 9</li>
                
              </ul>
            
          </article>
        
          <article class="cv-role">
            <h3>Web developer · JUICE ApS</h3>
            <p class="meta">
              <time datetime="2023-01">January 2023</time>
              
                – <time datetime="2023-08">August 2023</time>
              
              — Copenhagen
            </p>
            <p>Job &#38; candidate matchmaking platform</p>
            
              <ul>
                
                  <li>Introduced CI/CD enabling efficient and fast delivery of Symfony 6</li>
                
                  <li>Contributed to multiple features in Symfony &#38; Twig + Stimulus.js</li>
                
              </ul>
            
          </article>
        
          <article class="cv-role">
            <h3>Software developer · Syncronet</h3>
            <p class="meta">
              <time datetime="2020-04">April 2020</time>
              
                – <time datetime="2023-01">January 2023</time>
              
              — Slagelse
            </p>
            <p>Live streaming social media platform</p>
            
              <ul>
                
                  <li>Led migration from an expensive setup on Azure using media services to Linode with mux.com for video delivery</li>
                
                  <li>Architectured a Kubernetes cluster with Go services and Nginx endpoints wrapping FFmpeg for internal video processing and delivery</li>
                
                  <li>Led frontend development in Nuxt 3 and mobile development in React Native while maintaining Laravel backend</li>
                
              </ul>
            
          </article>
        
          <article class="cv-role">
            <h3>IT &#38; developer · GHC Travel / Iraqi Airways</h3>
            <p class="meta">
              <time datetime="2017-01">January 2017</time>
              
                – <time datetime="2020-02">February 2020</time>
              
              — Copenhagen
            </p>
            <p>Airline booking platform</p>
            
              <ul>
                
                  <li>Maintained and developed a basic PHP platform</li>
                
                  <li>Migrated from traditional PHP web host to VPS servers I setup, managed and monitored</li>
                
                  <li>Successfully migrated to Laravel 6 and maintained up version 8, including comprehensive PHPUnit test suite ensuring fast feedback loops on changes</li>
                
                  <li>Built 3 distinct frontends in Nuxt 2 consuming API hosted on Laravel backend, ensuring better scalability, user experience and content delivery via CDN</li>
                
                  <li>Greatly improved ticketing workflows by automating airport terminal interactions using UiPath RPA, improving ticket sales and customer satisfaction</li>
                
              </ul>
            
          </article>
        
    
        <h2>Skills</h2>
        <ul class="cv-skills">
          
            <li>Linux server management and maintenance</li>
          
            <li>Web &#38; App development</li>
          
            <li>Database administration</li>
          
        </ul>
    
        <h2>Education</h2>
        
          <p class="lede">Two short-cycle higher educations.</p>
        
        
          <article class="cv-role">

    <section id="6-Build-the-ISO-and-wipe-the-disk">
    <h2>6. Build the ISO and wipe the disk</h2>
    <p>Delete the source ISO before building, or you run out of space in the overlay.</p>
    <div class="codeblock"><div class="filename">6-build-and-wipe.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">rm</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>f</span> <span class="hl-meta hl-group hl-expansion hl-parameter hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-variable hl-other hl-readwrite hl-shell">I</span></span></span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">xorriso</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>as</span> mkisofs<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>r</span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>V</span> FREEBSD_INSTALL<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>b</span> boot/cdboot<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>no-emul-boot</span> <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">        -</span>o</span> athletos-install.iso isowork/</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">rm</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>rf</span> isowork</span>
    
    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> zfs labels sit at both ends of the device, so wipefs alone is not enough</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-variable hl-other hl-readwrite hl-assignment hl-shell">SECTORS</span><span class="hl-keyword hl-operator hl-assignment hl-shell">=</span><span class="hl-string hl-unquoted hl-shell"><span class="hl-meta hl-group hl-expansion hl-command hl-parens hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-punctuation hl-section hl-parens hl-begin hl-shell">(</span><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">blockdev</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> --</span>getsz</span> /dev/sda</span><span class="hl-punctuation hl-section hl-parens hl-end hl-shell">)</span></span></span>
    <span class="hl-variable hl-other hl-readwrite hl-assignment hl-shell">MIB</span><span class="hl-keyword hl-operator hl-assignment hl-shell">=</span><span class="hl-string hl-unquoted hl-shell"><span class="hl-meta hl-group hl-expansion hl-arithmetic hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-punctuation hl-section hl-parens hl-begin hl-shell">((</span> SECTORS <span class="hl-keyword hl-operator hl-arithmetic hl-shell">/</span> <span class="hl-constant hl-numeric hl-integer hl-decimal hl-shell">2048</span> <span class="hl-punctuation hl-section hl-parens hl-end hl-shell">))</span></span></span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">wipefs</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>a</span> /dev/sda</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">dd</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> if=/dev/zero of=/dev/sda bs=1M count=64 conv=fsync</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">dd</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> if=/dev/zero of=/dev/sda bs=1M seek=<span class="hl-meta hl-group hl-expansion hl-arithmetic hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-shell">$</span><span class="hl-punctuation hl-section hl-parens hl-begin hl-shell">((</span> MIB <span class="hl-keyword hl-operator hl-arithmetic hl-shell">-</span> <span class="hl-constant hl-numeric hl-integer hl-decimal hl-shell">64</span> <span class="hl-punctuation hl-section hl-parens hl-end hl-shell">))</span></span> count=64 conv=fsync</span>
    </span></code></pre></div>
    <div class="warning">
    <h2 id="What-went-wrong-1">What went wrong</h2>
    <p>An earlier attempt got far enough to create a <code>zroot</code> pool before failing.</p>
    <p>The next run found it and stopped to ask for a different pool name, which is another dialog nobody is there to answer. Wipe both ends between attempts.</p>
    </div>
    </section>
    <section id="7-Run-the-installer-under-QEMU">
    <h2>7. Run the installer under QEMU</h2>
    <p>Hetzner Cloud has no nested virtualisation, so there is no <code>/dev/kvm</code> and this runs under TCG emulation. It takes roughly half an hour. Nothing to do but watch the log.</p>
    <div class="codeblock"><div class="filename">7-install.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">qemu-system-x86_64</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>accel</span> tcg,thread=multi<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>m</span> 2048<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>smp</span> 2 <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">  -</span>drive</span> file=/dev/sda,format=raw,if=virtio,cache=writeback <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">  -</span>cdrom</span> athletos-install.iso<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>boot</span> d <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">  -</span>netdev</span> user,id=n0<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>device</span> virtio-net-pci,netdev=n0 <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">  -</span>display</span> none<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>monitor</span> none<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>serial</span> file:/root/install.log<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>daemonize</span></span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">grep</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>aoE</span> <span class="hl-string hl-quoted hl-double hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&quot;</span>Running installation step: [a-z]+<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&quot;</span></span> /root/install.log</span> <span class="hl-keyword hl-operator hl-logical hl-pipe hl-shell">|</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">uniq</span></span>
    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> zfsboot mount distfetch checksum distextract bootconfig config</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> entropy umount script</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span></span></code></pre></div>
    <p>Kill QEMU once the script step finishes, or it reboots straight back into the installer.</p>
    </section>
    <section id="8-Boot-it-and-fix-fstab">
    <h2>8. Boot it, and fix fstab</h2>
    <div class="codeblock"><div class="filename">8-boot.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">hcloud</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> server disable-rescue athletos</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">hcloud</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> server reset athletos</span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">ssh</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> root@<span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&lt;</span>ip<span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&gt;</span>
    </span>
    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> the installer ran under qemu virtio (vtbd0), hetzner presents da0.</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> the pool is fine because zfs scans devices. swap is not.</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-meta hl-function-call hl-shell"><span class="hl-support hl-function hl-printf hl-shell">printf</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> <span class="hl-string hl-quoted hl-single hl-shell"><span class="hl-punctuation hl-definition hl-string hl-begin hl-shell">&#39;</span>/dev/gpt/swap0\tnone\tswap\tsw\t0\t0\n<span class="hl-punctuation hl-definition hl-string hl-end hl-shell">&#39;</span></span> <span class="hl-keyword hl-operator hl-assignment hl-redirection hl-shell">&gt;</span> /etc/fstab</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">swapon</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>a</span></span>
    </span></code></pre></div>
    <div class="warning">
    <h2 id="What-went-wrong-2">What went wrong</h2>
    <p>The generated fstab pointed at <code>/dev/vtbd0p2</code>, which does not exist on the real machine.</p>
    <p>It booted with no swap and said nothing about it. Refer to it by GPT label and the device name stops mattering.</p>
    </div>
    </section>
    <section id="Result">
    <h2>Result</h2>
    <div class="codeblock"><div class="filename">athletos</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">FreeBSD</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> athletos 15.1-RELEASE ... GENERIC amd64</span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">zroot</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">            658M / 34.2G      all pools are healthy</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">/dev/gpt/swap0</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">   2.0G                     0<span class="hl-meta hl-group hl-expansion hl-job hl-shell"><span class="hl-punctuation hl-definition hl-variable hl-job hl-shell">%</span></span> used</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">vfs.zfs.arc_max</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">  536870912                (512 MiB</span><span class="hl-meta hl-function-call hl-shell"></span><span class="hl-meta hl-post-cmd hl-shell">)</span>
    
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">1</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">  gptboot0   512 KiB   A501  freebsd-boot</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">2</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">  swap0      2.0 GiB   A502  freebsd-swap</span>
    <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">3</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell">  zfs0      36.1 GiB   A504  freebsd-zfs</span>
    </span></code></pre></div>
    <div class="note">
    <h2 id="Result-1">Result</h2>
    <p>15.1 on root-on-ZFS, a release the ISO library does not carry, from media you can verify.</p>
    </div>
    </section>
    <section id="Under-load">
    <h2>Under load</h2>
    <p>I measured this from a separate Hetzner VPS in the same datacentre, hel1, against a control: an identical CX23 running Ubuntu 24.04, the same Caddy 2.11.4 serving byte-identical files, with an ECDSA P-256 certificate to match. <code>vegeta</code>, a fresh TCP and TLS connection per request, which is what a crawler does and what a browser never does.</p>
    <div class="codeblock"><div class="filename">9-load.sh</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">vegeta</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> attack<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>targets</span> targets.txt<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>rate</span> 500<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>duration</span> 10s <span class="hl-punctuation hl-separator hl-continuation hl-line hl-shell">\
    </span><span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell">       -</span>keepalive</span><span class="hl-keyword hl-operator hl-assignment hl-option hl-shell">=</span>false<span class="hl-variable hl-parameter hl-option hl-shell"><span class="hl-punctuation hl-definition hl-parameter hl-shell"> -</span>timeout</span> 20s</span> <span class="hl-keyword hl-operator hl-logical hl-pipe hl-shell">|</span> <span class="hl-meta hl-function-call hl-shell"><span class="hl-variable hl-function hl-shell">vegeta</span></span><span class="hl-meta hl-function-call hl-arguments hl-shell"> report</span>
    
    <span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> freebsd   100/s  4.9ms   250/s  4.7ms   500/s  4.0ms   mean</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> ubuntu    100/s  5.7ms   250/s  5.0ms   500/s  5.2ms   mean</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span></span></code></pre></div>
    <p>At 100, 250 and 500 fresh connections a second both boxes delivered the full offered rate with 100% success, and the FreeBSD box was the faster of the two at every step.</p>
    <p>The crypto is not the constraint either.</p>
    <div class="codeblock"><div class="filename">openssl speed ecdsap256</div><pre class="hl-code"><code><span class="hl-source hl-shell hl-bash"><span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell"> sign/s</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell">  37920   this box (epyc, one core)</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span><span class="hl-comment hl-line hl-number-sign hl-shell"><span class="hl-punctuation hl-definition hl-comment hl-begin hl-shell">#</span></span><span class="hl-comment hl-line hl-number-sign hl-shell">  32614   ubuntu control (xeon, one core)</span><span class="hl-comment hl-line hl-number-sign hl-shell">
    </span></span></code></pre></div>
    <p>The EPYC signs 16% faster than the control’s Xeon, which is worth stating because it means the hardware favours the FreeBSD box rather than the other way round. Against 500 connections a second, 37,920 signatures is roughly 75x headroom. Whatever the ceiling is, it is not asymmetric crypto.</p>
    <div class="warning">
    <h2 id="Two-things-I-did-not-establish">Two things I did not establish</h2>
    <p>Above 500/s the measurements were not reproducible. One clean run at 1000/s had FreeBSD at 497/s and the Ubuntu control at 999/s. A later run gave 179/s at 1000/s, and then 566/s at 1500/s — more offered load producing more throughput, which is not a property a server can have. It is the single load generator accumulating TIME_WAIT between runs. A real answer needs several generators.</p>
    <p>An earlier attempt measured this from a Windows laptop over the public internet and got 50-100 connections a second. That was low by five to ten times, and the cause was ephemeral-port exhaustion on the client. The first measurement was wrong, and it was wrong in a way that produced a confident and completely incorrect explanation.</p>
    </div>
    <p>One hypothesis died on the way. FreeBSD’s <code>kern.ipc.soacceptqueue</code> is 128 and Ubuntu’s <code>net.core.somaxconn</code> is 4096, so the listen backlog differs by 32x, which looked like the obvious cause and survived the arithmetic. I set the control to 128, restarted Caddy so the listener picked the new value up, and it still delivered 999.9/s. Refuted.</p>
    <p>That leaves <code>pf</code>, which redirects 443 to Caddy’s high port, as the untested suspect. Untested because that high port is not reachable from outside, so there was no way to bypass the redirect and compare against it.</p>
    <p>The same steps work for any release. Change the version in step 3 and the rest follows.</p>
    <p>Every command above ran against a real CX23 in hel1.</p>
    </section>
    
      </article>
    
      
      

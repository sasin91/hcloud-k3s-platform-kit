# EXAMPLE. Placeholder values. Not referenced by kustomization.yaml.
#
# Copy to backup-secret.yaml, fill in, ENCRYPT WITH SOPS, then add it to
# kustomization.yaml. A plaintext copy of this file with real values committed
# to a repository is an object storage credential and a restic password in the
# same commit, which is the whole backup rather than half of it.
#
#   sops --encrypt --in-place tenants/<name>/backup-secret.yaml
#
# ONE REPOSITORY PER NAMESPACE. Not one bucket per namespace and not one shared
# repository with a prefix per tenant: a restic repository is a single
# encryption and deduplication domain, so a shared one means every tenant's
# password decrypts every tenant's data. The prefix in the URL below is what
# separates them inside one bucket.
apiVersion: v1
kind: Secret
metadata:
  name: backup-repository
  namespace: tenant-sasin91
type: Opaque
stringData:
  # s3:<endpoint>/<bucket>/<prefix>
  #
  # The snapshots bucket, not the state bucket. They have opposite retention
  # lifecycles — state versions are kept indefinitely, snapshots expire — and
  # the day somebody adds an expiry rule to stop paying for old snapshots in a
  # shared bucket, they are one prefix pattern away from expiring the state
  # history instead. That failure is silent until a recovery is attempted, and
  # what it destroys is the recovery path.
  RESTIC_REPOSITORY: "s3:https://OBJECT-STORAGE-ENDPOINT/BUCKET/tenants/sasin91"

  # Generate with a password manager, at length. This is the encryption key for
  # the repository: lose it and the backups are unreadable, including by you.
  # Store a copy outside the cluster and outside this repository.
  RESTIC_PASSWORD: "GENERATE-A-LONG-RANDOM-VALUE"

  # An object storage credential scoped to this tenant's prefix where the
  # provider supports it. restic uses the S3 API; the variable names are the
  # AWS SDK's regardless of provider.
  AWS_ACCESS_KEY_ID: "REPLACE"
  AWS_SECRET_ACCESS_KEY: "REPLACE"
  AWS_DEFAULT_REGION: "REPLACE"

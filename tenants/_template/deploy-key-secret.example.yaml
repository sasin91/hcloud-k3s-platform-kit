# EXAMPLE. Placeholder values. Not referenced by kustomization.yaml.
#
# The read-only deploy key the tenant's GitRepository authenticates with, in
# the tenant's own namespace, because cross-namespace references to the
# platform's source are disabled. See the note at the top of sync.yaml.
#
# Copy to deploy-key-secret.yaml, fill in, ENCRYPT WITH SOPS, then add it to
# kustomization.yaml.
#
# Delete both this and the secretRef in sync.yaml if the repository is public.
#
# A caveat worth knowing rather than discovering: this secret lives in the
# tenant's namespace, and the tenant's Role grants secrets access there, so a
# tenant workload can read it. It is a READ-ONLY key to a repository the tenant
# already has a directory in, so the exposure is bounded — but it is not zero,
# and a fork that gives tenants directories in a repository containing anything
# else needs a second repository rather than a second directory.
apiVersion: v1
kind: Secret
metadata:
  name: flux-deploy-key
  namespace: tenant-REPLACE-tenant
type: Opaque
stringData:
  identity: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE
    -----END OPENSSH PRIVATE KEY-----
  identity.pub: "REPLACE"
  # ssh-keyscan the forge's host key rather than trusting on first use.
  known_hosts: "REPLACE"

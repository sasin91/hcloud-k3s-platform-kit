# Group B -- provider facts. A read-only API token, no cluster.
#
# WHY THIS IS A SCHEDULE AND NOT ONLY A PULL-REQUEST CHECK
#
# A pool created when its instance type was in stock keeps that type in its
# configuration forever. Stock changes; the configuration does not. A check
# that runs only in the apply path passes on the day it is written and is never
# consulted again -- and the failure it exists to catch shows up months later,
# at the moment capacity is needed, with no commit to attribute it to.
#
# It also runs on pull requests that touch the infrastructure configuration,
# which is a convenience. The schedule is the point.
#
# THE CREDENTIAL
#
# Repository secret HCLOUD_TOKEN_READ_ONLY: a provider API token created with
# READ-ONLY permission, in the project holding the cluster. It is passed to the
# check as an environment variable, sent in an Authorization header, and never
# echoed, logged, written to a file or put on a command line. Nothing in this
# workflow has, or needs, cluster access -- no kubeconfig is ever placed in a
# build system.
#
# A fork that has not set the secret gets a clean skip on pull requests and a
# loud failure on the schedule, because a scheduled check that quietly does
# nothing is the failure mode this whole directory exists to prevent.
name: pool-availability

on:
  schedule:
    # Daily. Availability moves on the provider's timescale, not on yours.
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '**.tf'
      - '**.tofu'
      - '**.tfvars'
      - 'scripts/checks/check-pool-availability.py'
      - '.github/workflows/pool-availability.yml'

permissions:
  contents: read

jobs:
  availability:
    name: declared pools against current availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check declared pools against the provider API
        env:
          HCLOUD_TOKEN_READ_ONLY: ${{ secrets.HCLOUD_TOKEN_READ_ONLY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ -z "${HCLOUD_TOKEN_READ_ONLY:-}" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "No provider token available (a fork pull request cannot read secrets)."
              echo "Skipping: the scheduled run is the one that must not be skipped."
              exit 0
            fi
            echo "::error title=pool-availability::HCLOUD_TOKEN_READ_ONLY is not configured. Create a READ-ONLY provider API token and add it as a repository secret."
            exit 1
          fi
          python3 scripts/checks/check-pool-availability.py --require-token
